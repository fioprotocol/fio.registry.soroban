name: Build and Release
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update && cargo test

  release-fio-registry:
    needs: test
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'FioRegistry: FIO Protocol handles, domains and public-address mapping on Soroban'
      home_domain: 'fio.net'
      package: 'fio-registry'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
